name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the verification suite
        run: |
          cd code
          python3 checks_clusters.py | tee ../checks.log
          grep -q "0 failed" ../checks.log
      - name: Regenerate every figure and test for label collisions
        run: |
          cd code
          for f in fig01_arrangement fig02_torus fig03_formfactor fig04_residues fig05_propagator fig06_schwinger fig07_transfer fig08_annealed; do
            python3 $f.py | tee -a ../figs.log
          done
          ! grep -qE "[1-9][0-9]* collisions" ../figs.log
      - uses: actions/upload-artifact@v4
        with:
          name: logs-and-figures
          path: |
            checks.log
            figs.log
            paper/figs

  uv-finite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run the Python checks
        run: |
          cd uv-finite/code
          python3 verify.py | tee ../../uv-verify.log
          grep -q " 0 failed" ../../uv-verify.log
      - name: Run the C checks
        run: |
          cd uv-finite/code
          cc -O2 -std=c99 -Wall -Wextra -o formfactor_check formfactor_check.c -lm
          ./formfactor_check | tee ../../uv-c.log
          grep -q " 0 failed" ../../uv-c.log
      - name: Regenerate the figures
        run: |
          cd uv-finite/code
          FIG_OUT=../../uv-figs python3 make_figures.py
          test "$(ls ../../uv-figs/*.png | wc -l)" -eq 12
      - uses: actions/upload-artifact@v4
        with:
          name: uv-finite-logs-and-figures
          path: |
            uv-verify.log
            uv-c.log
            uv-figs

  uv-finite-julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.10"
      - name: Run the Julia checks
        run: |
          cd uv-finite/code
          julia verify.jl | tee ../../uv-julia.log
          grep -q " 0 failed" ../../uv-julia.log
      - uses: actions/upload-artifact@v4
        with:
          name: uv-finite-julia-log
          path: uv-julia.log

  uv-finite-lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean 4.15.0
        run: |
          curl -sSL -o lean.zip https://github.com/leanprover/lean4/releases/download/v4.15.0/lean-4.15.0-linux.zip
          unzip -q lean.zip
          echo "$PWD/lean-4.15.0-linux/bin" >> "$GITHUB_PATH"
      - name: Check the Lean proofs
        run: |
          cd uv-finite/code
          lean --version
          lean PowerCounting.lean 2>&1 | tee ../../uv-lean.log
          test "${PIPESTATUS[0]}" -eq 0
          ! grep -q "sorry" ../../uv-lean.log
